name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore locked dependencies
        run: dotnet restore GuitarNTE.slnx --locked-mode
      - name: Build Release
        run: dotnet build GuitarNTE.slnx -c Release --no-restore
      - name: Run assertions
        run: dotnet run --project tests/GuitarNTE.Tests -c Release --no-build
      - name: WPF headless smoke
        run: dotnet run --project tests/GuitarNTE.Tests -c Release --no-build -- --ui-headless
      - name: Package Windows x64
        run: ./build.ps1 -SkipTests
      - name: Upload portable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NTE-Piano-Guitar-Player-win-x64
          path: |
            artifacts/NTE-Piano-Guitar-Player-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name NTE-Piano-Guitar-Player-win-x64 --dir artifacts
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          $notes = "docs/releases/$env:RELEASE_TAG.md"
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG, 'artifacts/NTE-Piano-Guitar-Player-win-x64.zip', 'artifacts/SHA256SUMS.txt', '--repo', $env:GITHUB_REPOSITORY, '--verify-tag', '--title', "NTE Piano & Guitar Player $env:RELEASE_TAG")
          if (Test-Path -LiteralPath $notes) { $releaseArgs += @('--notes-file', $notes) }
          else { $releaseArgs += '--generate-notes' }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
